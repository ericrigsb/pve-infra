name: Generate Secrets and Reconcile

on:
  push:
    branches:
      - main
    paths:
      - 'cluster/redcloud/**'
  workflow_dispatch: {}

env:
  KUBECONFIG_PATH: /tmp/kubeconfig
  FLUX_NAMESPACE: flux-system
  KUBECTL_VERSION: v1.33.0

jobs:
  generate_secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $KUBECONFIG_PATH
          chmod 600 $KUBECONFIG_PATH

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Ensure cert-manager namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace cert-manager || kubectl create namespace cert-manager

      - name: Create Cloudflare API token secret for cert-manager
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic cloudflare-api-token \
            --namespace cert-manager \
            --from-literal=api-token="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure mailrise namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace mailrise || kubectl create namespace mailrise

      - name: Create Mailrise Slack API key secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic mailrise-slack \
            --namespace mailrise \
            --from-literal=SLACK_API_URL="${{ secrets.MAILRISE_SLACK_API_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure mongodb namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace mongodb || kubectl create namespace mongodb

      - name: Create MongoDB secrets
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic mongodb-auth \
            --namespace mongodb \
            --from-literal=mongodb-root-password="${{ secrets.MONGODB_ROOT_PASSWORD }}" \
            --from-literal=mongodb-usernames="unifi" \
            --from-literal=mongodb-databases="unifi,unifi_stat,unifi_audit" \
            --from-literal=mongodb-passwords="${{ secrets.MONGODB_PASSWORDS }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure unifi-network-application namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace unifi-network-application || kubectl create namespace unifi-network-application

      - name: Create Unifi DB secret in mongodb namespace
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic unifi-db-secret \
            --namespace mongodb \
            --from-literal=password="${{ secrets.UNIFI_DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Unifi Network Application database secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic unifi-db-secret \
            --namespace unifi-network-application \
            --from-literal=password="${{ secrets.UNIFI_DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure postgresql namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace postgresql || kubectl create namespace postgresql

      - name: Create PostgreSQL secrets
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic postgresql-auth \
            --namespace postgresql \
            --from-literal=postgres-password="${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure redis namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace redis || kubectl create namespace redis

      - name: Create Redis secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic redis-auth \
            --namespace redis \
            --from-literal=redis-password="${{ secrets.REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure immich namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace immich || kubectl create namespace immich

      - name: Create Immich DB secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic immich-db-secret \
            --namespace immich \
            --from-literal=postgres-password="${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}" \
            --from-literal=redis-password="${{ secrets.REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure nextcloud namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace nextcloud || kubectl create namespace nextcloud

      - name: Create Nextcloud DB secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic nextcloud-db \
            --namespace nextcloud \
            --from-literal=db-username=postgres \
            --from-literal=db-password="${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}" \
            --from-literal=redis-password="${{ secrets.REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Nextcloud admin secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic nextcloud \
            --namespace nextcloud \
            --from-literal=nextcloud-username=admin \
            --from-literal=nextcloud-password="${{ secrets.NEXTCLOUD_ADMIN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Ensure music-assistant namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace music-assistant || kubectl create namespace music-assistant

      - name: Create Restic secret in app namespaces
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          for namespace in immich nextcloud unifi-network-application music-assistant; do
            kubectl create secret generic restic-secret \
              --namespace $namespace \
              --from-literal=password='${{ secrets.RESTIC_REPO_PASSWORD }}' \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Create Slack webhook secret in app namespaces for backup notifications
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          for namespace in immich nextcloud unifi-network-application music-assistant; do
            kubectl create secret generic slack-webhook \
              --namespace $namespace \
              --from-literal=webhook-url="${{ secrets.MAILRISE_SLACK_API_URL }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Create Gitea registry image pull secrets for backup jobs
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          for namespace in immich nextcloud unifi-network-application music-assistant; do
            kubectl create secret docker-registry gitea-registry \
              --namespace=$namespace \
              --docker-server="${{ vars.REGISTRY_HOSTNAME }}" \
              --docker-username="${{ secrets.REGISTRY_USER }}" \
              --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
              --docker-email="registry@gitea.mesh.rigsb.net" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Ensure nutweb namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace nutweb || kubectl create namespace nutweb

      - name: Create Nutweb secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic nutweb-secret \
            --namespace nutweb \
            --from-literal=UPSD_USER="${{ secrets.NUT_USER }}" \
            --from-literal=UPSD_PASS="${{ secrets.NUT_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure external-dns namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace external-dns || kubectl create namespace external-dns

      - name: Create External DNS Technitium secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic external-dns-technitium-secret \
            --namespace external-dns \
            --from-literal=TECHNITIUM_TSIG_KEYNAME="${{ secrets.TECHNITIUM_TSIG_KEYNAME }}" \
            --from-literal=TECHNITIUM_TSIG_SECRET="${{ secrets.TECHNITIUM_TSIG_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: ensure docker-shared namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace docker-shared || kubectl create namespace docker-shared

      - name: Ensure backrest namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace backrest || kubectl create namespace backrest

      - name: Create Restic secret in backrest namespace
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret generic restic-secret \
            --namespace backrest \
            --from-literal=password='${{ secrets.RESTIC_REPO_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Backrest admin secret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          # Passed through env rather than inlined into the run block. A bcrypt
          # hash contains '$' characters, and an inlined ${{ }} value would be
          # re-parsed by the shell, silently corrupting the hash into one that
          # can never authenticate. The runner sets env vars directly, so the
          # value is never re-scanned.
          BACKREST_ADMIN_BCRYPT: ${{ secrets.BACKREST_ADMIN_BCRYPT }}
        run: |
          if [ -z "$BACKREST_ADMIN_BCRYPT" ]; then
            echo "::error::BACKREST_ADMIN_BCRYPT is not set. Generate one with: htpasswd -nbBC 10 '' 'yourpassword' | cut -d: -f2"
            exit 1
          fi
          kubectl create secret generic backrest-admin \
            --namespace backrest \
            --from-literal=passwordBcrypt="$BACKREST_ADMIN_BCRYPT" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure novnc-workmac namespace exists
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl get namespace novnc-workmac || kubectl create namespace novnc-workmac

  reconcile_flux:
    runs-on: ubuntu-latest
    needs: generate_secrets

    steps:
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $KUBECONFIG_PATH
          chmod 600 $KUBECONFIG_PATH

      - name: Install Flux CLI
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Reconcile all Flux Kustomizations
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          for k in $(kubectl --kubeconfig=$KUBECONFIG_PATH get kustomizations.kustomize.toolkit.fluxcd.io -n $FLUX_NAMESPACE -o name); do
            name=$(echo $k | cut -d/ -f2)
            flux reconcile kustomization $name --namespace=$FLUX_NAMESPACE --kubeconfig=$KUBECONFIG_PATH || true
          done

      - name: Copy backup scripts to app namespaces
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          
          # Wait for Flux to apply the pushed revision, not merely for the
          # ConfigMap to exist. The ConfigMap has been in the cluster since it
          # was first added, so an existence check passed instantly and copied
          # the previous revision whenever Flux was still reconciling. That
          # deployed stale backup scripts silently, which is how a broken
          # kubectl helper reached every app namespace.
          echo "Waiting for Flux to apply $EXPECTED_REVISION to the backups kustomization..."
          for i in {1..60}; do
            ready=$(kubectl get kustomization backups -n $FLUX_NAMESPACE \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
            applied=$(kubectl get kustomization backups -n $FLUX_NAMESPACE \
              -o jsonpath='{.status.lastAppliedRevision}' 2>/dev/null || echo "")
            if [ "$ready" = "True" ] && [[ "$applied" == *"$EXPECTED_REVISION"* ]]; then
              echo "Flux applied $applied"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Flux did not apply $EXPECTED_REVISION to the backups kustomization within 10 minutes (ready='$ready' applied='$applied'). Refusing to copy backup scripts that may be stale. Re-run this workflow."
              exit 1
            fi
            echo "Attempt $i/60: ready='$ready' applied='$applied'"
            sleep 10
          done
          
          # Copy backup-scripts ConfigMap to each app namespace.
          # Applied rather than delete-then-apply: deleting first leaves a
          # window where a starting backup pod cannot mount the ConfigMap.
          for namespace in immich nextcloud unifi-network-application music-assistant; do
            echo "Copying backup-scripts ConfigMap to $namespace namespace..."
            kubectl get configmap backup-scripts -n backups -o yaml | \
              sed "s/namespace: backups/namespace: $namespace/" | \
              sed '/resourceVersion:/d' | \
              sed '/uid:/d' | \
              sed '/creationTimestamp:/d' | \
              kubectl apply -f -
          done
          
          # Confirm every copy is byte-identical to the source, so a partial or
          # failed copy cannot pass unnoticed.
          source_hash=$(kubectl get configmap backup-scripts -n backups \
            -o jsonpath='{.data.backup-service\.sh}' | sha256sum | cut -d' ' -f1)
          for namespace in immich nextcloud unifi-network-application music-assistant; do
            copy_hash=$(kubectl get configmap backup-scripts -n $namespace \
              -o jsonpath='{.data.backup-service\.sh}' | sha256sum | cut -d' ' -f1)
            if [ "$copy_hash" != "$source_hash" ]; then
              echo "::error::backup-scripts in $namespace does not match the source in the backups namespace"
              exit 1
            fi
            echo "  $namespace matches source"
          done