- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present

- name: Ensure the user exists
  ansible.builtin.user:
    name: "{{ common_username }}"
    password: "{{ common_password | password_hash('sha512') }}"
    shell: /bin/bash
    groups: sudo
    append: true
    state: present
    create_home: true

- name: Set authorized key for user
  ansible.posix.authorized_key:
    user: "{{ common_username }}"
    state: present
    key: "{{ common_ssh_pub_key }}"
    path: "/home/{{ common_username }}/.ssh/authorized_keys"

- name: Disable password authentication in SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
    backup: true

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted
    enabled: true

- name: Register host IPv4 address in Technitium DNS
  ansible.builtin.uri:
    url: "{{ common_technitium_url }}/api/zones/records/add"
    method: POST
    headers:
      Authorization: "Bearer {{ common_technitium_api_token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ ansible_facts['hostname'] }}.{{ common_technitium_zone }}"
      zone: "{{ common_technitium_zone }}"
      type: A
      ttl: 3600
      ipAddress: "{{ inventory_hostname }}"
      overwrite: "true"
    status_code: 200
  when:
    - common_technitium_url | length > 0
    - common_technitium_api_token | length > 0
  register: community_script_technitium_record_result

- name: Fail if Technitium DNS record update was unsuccessful
  ansible.builtin.fail:
    msg: "Technitium API error: {{ community_script_technitium_record_result.json.errorMessage | default('unknown error') }}"
  when:
    - community_script_technitium_record_result is not skipped
    - community_script_technitium_record_result.json.status | default('') != 'ok'
