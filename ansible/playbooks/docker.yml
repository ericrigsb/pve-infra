- name: Docker
  hosts: all
  roles:
    - common
    - docker
    # Owns the file-server package layer and the four NFS exports for
    # /mnt/share. The Samba shares on this host are NOT managed -- they live in
    # the samba registry (`include = registry`) and cannot be templated
    # without migrating them out first. See AGENTS.md #12 and
    # roles/cockpit_files/README.md.
    - role: cockpit_files
      vars:
        # ansible.sh runs with `-i "$IP,"`, so inventory_hostname is a bare IP
        # and a role-local host_vars/ would never be auto-loaded. Naming the
        # file explicitly keeps the key a hostname. See the role README.
        # The var is not called `vars_files` because that is an Ansible
        # reserved name (ansible-lint var-naming/no-reserved).
        cockpit_files_vars_file: vars/docker.yml
      # Loaded by the role's own include_vars task, not by a `vars_files:`
      # keyword here. One mechanism, not two, and it keeps the role's
      # "was a vars file named?" assertion meaningful. (ansible-lint also
      # misreads the `vars_files` keyword as a reserved variable name.)
