apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.18.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53
      - --dns01-recursive-nameservers-only
    # All three components shipped with no requests at all, so they were
    # BestEffort and first in line for eviction — the same condition that
    # evicted traefik (#521). Requests are sized just under measured usage
    # (controller 84Mi, cainjector 62Mi, webhook 64Mi). The ephemeral-storage
    # request is what actually mattered for traefik: with a zero request, *any*
    # disk usage counts against the pod during nodefs eviction.
    # No CPU or memory limits on purpose — these are tiny control-plane pods and
    # a limit only gives kubelet a new reason to kill them.
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
        ephemeral-storage: 64Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
          ephemeral-storage: 64Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
          ephemeral-storage: 64Mi