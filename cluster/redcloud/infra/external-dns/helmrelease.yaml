apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-technitium
  namespace: external-dns
spec:
  interval: 10m
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  values:
    # No requests at all before this, so BestEffort and an eviction target
    # (measured usage: 2m CPU / 34Mi). The ephemeral-storage request is the part
    # that matters for nodefs eviction ranking; no limits on purpose.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
        ephemeral-storage: 64Mi
    sources:
      - ingress
      - service
      - traefik-proxy
    registry: txt
    txtOwnerId: k8s-redcloud
    txtPrefix: k8s-
    policy: sync
    domainFilters:
      - mesh.rigsb.net
    logLevel: error
    logFormat: json
    interval: 5m
    provider:
      name: rfc2136
    extraArgs:
      - --rfc2136-host=10.0.4.5
      - --rfc2136-port=53
      - --rfc2136-zone=mesh.rigsb.net
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-axfr
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-technitium-secret
            key: TECHNITIUM_TSIG_SECRET
      - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
        valueFrom:
          secretKeyRef:
            name: external-dns-technitium-secret
            key: TECHNITIUM_TSIG_KEYNAME
