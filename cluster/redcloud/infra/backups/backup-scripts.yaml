apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: backups
data:
  backup-service.sh: |
    #!/bin/bash
    set -e
    
    # Kubernetes API endpoints for control-plane calls.
    #
    # The in-pod ClusterIP (10.96.0.1) is unreliable in this cluster: connections
    # are refused for roughly a third of all attempts, measured identically from
    # every worker. Both control-plane nodes answer 100% of direct requests, so
    # address them directly and alternate between them. That keeps a single node
    # outage from failing a backup.
    #
    # Keep in sync with cluster_endpoint in terraform/talos.tf.
    KUBE_API_ENDPOINTS=(10.0.4.2:6443 10.0.4.6:6443)
    
    # Run kubectl against a control-plane endpoint, retrying and failing over
    # between nodes. stdout is passed through untouched so callers can redirect
    # it (pg_dump writes its dump to a file this way).
    #
    # The address is redirected by overriding the in-pod API host rather than by
    # passing --server. Passing --server makes kubectl build its config from the
    # flag alone, so it never picks up the mounted service-account token and
    # prompts "Please enter Username" instead, which fails with 401.
    kube_api() {
      local attempt=0
      local max="${KUBE_API_ATTEMPTS:-6}"
      local endpoint host port
      while [ "$attempt" -lt "$max" ]; do
        endpoint="${KUBE_API_ENDPOINTS[$(( attempt % ${#KUBE_API_ENDPOINTS[@]} ))]}"
        host="${endpoint%%:*}"
        port="${endpoint##*:}"
        if KUBERNETES_SERVICE_HOST="$host" KUBERNETES_SERVICE_PORT="$port" kubectl "$@"; then
          return 0
        fi
        attempt=$((attempt+1))
        if [ "$attempt" -lt "$max" ]; then
          echo "  kubectl failed via ${endpoint}, retry ${attempt}/$((max-1))" >&2
          sleep $((attempt * 2))
        fi
      done
      return 1
    }
    
    # Function to send notifications
    send_notification() {
      local subject="$1"
      local body="$2"
      
      # Use cached webhook URL or get it fresh if not cached
      local SLACK_WEBHOOK="${CACHED_WEBHOOK}"
      if [ -z "$SLACK_WEBHOOK" ]; then
        SLACK_WEBHOOK=$(KUBE_API_ATTEMPTS=2 kube_api get secret slack-webhook -o jsonpath='{.data.webhook-url}' 2>/dev/null | base64 -d 2>/dev/null)
      fi
      
      # Validate webhook URL before using
      if [ -n "$SLACK_WEBHOOK" ] && [ ${#SLACK_WEBHOOK} -gt 20 ]; then
        # Send direct to Slack webhook
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$subject\\n$body\"}" \
          "$SLACK_WEBHOOK" || true
      else
        echo "Warning: Slack webhook URL is empty or invalid, skipping notification"
      fi
    }
    
    # Function to backup a single service
    backup_service() {
      local service_name="$1"
      local repo_path="$2"
      local backup_paths="$3"
      local pre_backup_cmd="${4:-}"
      local post_backup_cmd="${5:-}"
      
      # Cache webhook URL once at the start to avoid kubectl API cache issues
      export CACHED_WEBHOOK=$(KUBE_API_ATTEMPTS=2 kube_api get secret slack-webhook -o jsonpath='{.data.webhook-url}' 2>/dev/null | base64 -d 2>/dev/null)
      
      echo "=== Starting $service_name backup at $(date) ==="
      send_notification "🔄 $service_name Backup Started" "$service_name backup started at $(date)"
      
      # Set repository for this service
      export RESTIC_REPOSITORY="$repo_path"
      
      # Initialize repository if it doesn't exist
      restic cat config || restic init
       
       # Run pre-backup command if provided
       if [ -n "$pre_backup_cmd" ]; then
         echo "Running pre-backup command for $service_name..."
         if $pre_backup_cmd; then
           echo "✅ Pre-backup command completed successfully"
         else
           echo "❌ Pre-backup command failed"
           hook_failed=true
         fi
       fi
       
       # Clear stale locks left behind by pods that died mid-operation.
       #
       # restic only auto-breaks a lock when it can prove no other process is
       # alive; over NFS it cannot, so any lock left by a pod that vanished
       # without releasing it blocks every later run until it is removed by
       # hand. On 10-01 and 10-02 the nextcloud backup saved its snapshot
       # successfully and then failed here, reporting a good backup as failed.
       #
       # These repos are single-writer (one CronJob at a time, and the schedules
       # are staggered across the shared NFS export), so breaking a lock here
       # cannot destroy a live writer's snapshot. Do NOT add --no-lock to the
       # backup or prune calls instead: that trades a recoverable prune failure
       # for corrupt concurrent writes.
       echo "Checking for repository locks..."
       if [ -n "$(restic list locks 2>/dev/null)" ]; then
         echo "  stale locks found, removing:"
         restic list locks 2>/dev/null | sed 's/^/    /'
         if restic unlock 2>&1 | sed 's/^/    /'; then
           echo "  locks cleared"
         else
           echo "  ⚠️ could not clear locks; backup may fail below"
         fi
       else
         echo "  no locks present"
       fi

        # Perform backup
        local backup_success=true
        local hook_failed=false
        if restic backup $backup_paths \
        --tag $(echo "$service_name" | tr '[:upper:]' '[:lower:]' | tr ' ' '-') \
        --tag daily \
        --host k8s-cluster; then
        
        # Cleanup old backups (keep 7 daily, 4 weekly, 1 monthly).
        #
        # A failure here is a retention problem, not a data-loss problem: the
        # snapshot above is already committed and safe. Under `set -e` an
        # unguarded `forget` aborts the script before the success path, so a
        # stale lock would mark a completed backup as failed. Report it and
        # carry on; the next run retries the prune.
        if restic forget \
          --keep-daily 7 \
          --keep-weekly 4 \
          --keep-monthly 1 \
          --tag $(echo "$service_name" | tr '[:upper:]' '[:lower:]' | tr ' ' '-') \
          --prune; then
          :
        else
          echo "⚠️ $service_name prune/retention failed; snapshot is saved and will be pruned on a later run"
        fi
        
        echo "✅ $service_name backup completed successfully at $(date)"
      else
        backup_success=false
        echo "❌ $service_name backup failed at $(date)"
      fi
      
      # Run post-backup command if provided
      if [ -n "$post_backup_cmd" ]; then
        echo "Running post-backup command for $service_name..."
        if $post_backup_cmd; then
          echo "✅ Post-backup command completed successfully"
        else
          echo "❌ Post-backup command failed"
          # The data backup itself may still have succeeded, but a failed
          # post-backup hook (for example leaving the app in maintenance mode)
          # must not be reported as a clean run.
          hook_failed=true
        fi
      fi
      
      # A pre/post hook can set SOFT_FAILURE with a reason to mark the run as
      # failed while still letting the data backup complete and be retained.
      # Used when a backup is only partially complete -- for example a database
      # dump that could not be created -- so the gap is visible instead of
      # being silently reported as success.
      if [ -n "${SOFT_FAILURE:-}" ]; then
        echo "❌ $service_name backup incomplete: $SOFT_FAILURE"
        hook_failed=true
      fi
      
      # Send completion notification
      if [ "$backup_success" = true ] && [ "$hook_failed" != true ]; then
        send_notification "✅ $service_name Backup Complete" "$service_name backup completed successfully at $(date)"
        exit 0
      else
        send_notification "❌ $service_name Backup Failed" "$service_name backup failed at $(date)${SOFT_FAILURE:+ ($SOFT_FAILURE)}"
        exit 1
      fi
    }