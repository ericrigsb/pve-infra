apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: "0.14.6"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Neither component had requests, so both were BestEffort and candidates for
    # eviction during node pressure. The speaker is the one that actually
    # matters: it is what announces the MetalLB VIP (10.0.4.100) by ARP, so an
    # eviction there can flap ingress. Measured: controller 2m/39Mi,
    # speaker 11-19m/50-103Mi (one pod per node, 6 total). Requests sit just
    # above speaker usage and are small enough not to constrain any node — the
    # tightest node has ~538Mi free. No limits on purpose.
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
          ephemeral-storage: 64Mi
    speaker:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
          ephemeral-storage: 64Mi
    webhook:
      enabled: false