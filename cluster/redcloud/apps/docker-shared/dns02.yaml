---
apiVersion: v1
kind: Service
metadata:
  name: dns02
  namespace: docker-shared
spec:
  ports:
    - port: 5380
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dns02
  namespace: docker-shared
subsets:
  - addresses:
      - ip: 10.0.4.3
    ports:
      - port: 5380
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dns02
  namespace: docker-shared
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: traefik.mesh.rigsb.net
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`dns02.mesh.rigsb.net`)
      kind: Rule
      services:
        - name: dns02
          port: 5380
      middlewares:
        - name: limit-buffering
          namespace: traefik
        - name: security-headers
          namespace: traefik
