---
# Router HTTP admin panel
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: docker-shared
spec:
  ports:
    - port: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: router
  namespace: docker-shared
subsets:
  - addresses:
      - ip: 10.0.4.1
    ports:
      - port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router
  namespace: docker-shared
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: traefik.mesh.rigsb.net
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`router.mesh.rigsb.net`)
      kind: Rule
      services:
        - name: router
          port: 80
      middlewares:
        - name: limit-buffering
          namespace: traefik
        - name: security-headers
          namespace: traefik
---
# Winbox TCP (MikroTik management)
apiVersion: v1
kind: Service
metadata:
  name: winbox
  namespace: docker-shared
spec:
  ports:
    - port: 8291
---
apiVersion: v1
kind: Endpoints
metadata:
  name: winbox
  namespace: docker-shared
subsets:
  - addresses:
      - ip: 10.0.4.1
    ports:
      - port: 8291
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: winbox
  namespace: docker-shared
spec:
  entryPoints:
    - winbox
  routes:
    - match: HostSNI(`*`)
      services:
        - name: winbox
          port: 8291
