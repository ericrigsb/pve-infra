---
apiVersion: v1
kind: Service
metadata:
  name: bt-switch
  namespace: docker-shared
spec:
  ports:
    - port: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: bt-switch
  namespace: docker-shared
subsets:
  - addresses:
      - ip: 192.168.1.2
    ports:
      - port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bt-switch
  namespace: docker-shared
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: traefik.mesh.rigsb.net
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`bt-switch.mesh.rigsb.net`)
      kind: Rule
      services:
        - name: bt-switch
          port: 80
