---
apiVersion: v1
kind: Service
metadata:
  name: btbridge
  namespace: docker-shared
spec:
  ports:
    - port: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: btbridge
  namespace: docker-shared
subsets:
  - addresses:
      - ip: 10.0.4.20
    ports:
      - port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: btbridge
  namespace: docker-shared
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: traefik.mesh.rigsb.net
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`btbridge.mesh.rigsb.net`)
      kind: Rule
      services:
        - name: btbridge
          port: 8080
      middlewares:
        - name: limit-buffering
          namespace: traefik
        - name: security-headers
          namespace: traefik
