apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: novnc-workmac
  namespace: novnc-workmac
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: traefik.mesh.rigsb.net
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`novnc-workmac.mesh.rigsb.net`)
      kind: Rule
      services:
        - name: novnc-workmac
          port: 80
      middlewares:
        - name: limit-buffering
          namespace: traefik
        - name: security-headers
          namespace: traefik
