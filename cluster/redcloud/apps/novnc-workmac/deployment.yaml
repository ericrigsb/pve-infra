apiVersion: apps/v1
kind: Deployment
metadata:
  name: novnc-workmac
  namespace: novnc-workmac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novnc-workmac
  template:
    metadata:
      labels:
        app: novnc-workmac
    spec:
      containers:
        - name: novnc-workmac
          image: bonigarcia/novnc:1.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: VNC_SERVER
              value: "10.0.2.21:5900"
            - name: AUTOCONNECT
              value: "true"
          ports:
            - name: http
              containerPort: 6080
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 300m
