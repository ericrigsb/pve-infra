apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mailrise
  namespace: mailrise
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: traefik.mesh.rigsb.net
spec:
  entryPoints:
    - mailrise
  routes:
    - match: HostSNI(`*`)
      services:
        - name: mailrise
          port: 8025