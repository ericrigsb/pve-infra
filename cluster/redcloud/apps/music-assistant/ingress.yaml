apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: music-assistant
  namespace: music-assistant
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: traefik.mesh.rigsb.net
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`music-assistant.mesh.rigsb.net`)
      kind: Rule
      services:
        - name: music-assistant
          port: 8095
      middlewares:
        - name: security-headers
          namespace: traefik