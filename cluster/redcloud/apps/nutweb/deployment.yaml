apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutweb
  namespace: nutweb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nutweb
  template:
    metadata:
      labels:
        app: nutweb
    spec:
      # Stateless read-only proxy in front of upsd, so a second replica is free
      # availability. Required anti-affinity keeps the pair on separate nodes;
      # without it both can land together and be lost together.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nutweb
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nutweb
          image: ghcr.io/superioone/nut_webgui:latest
          envFrom:
            - secretRef:
                name: nutweb-secret
          env:
            - name: UPSD_ADDR
              value: "10.0.4.251"
            - name: UPSD_PORT
              value: "3493"
            - name: POLL_FREQ
              value: "20"
          resources:
            limits:
              memory: "96Mi"
              cpu: "375m"
            requests:
              memory: "48Mi"
              cpu: "150m"
              # Ranking-only floor: keeps the pod out of kubelet's "usage above a
              # zero request" eviction bucket. Not a limit.
              ephemeral-storage: "128Mi"
          ports:
            - containerPort: 9000
          startupProbe:
            httpGet:
              path: /probes/readiness
              port: 9000
            initialDelaySeconds: 5
            failureThreshold: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /probes/health
              port: 9000
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /probes/readiness
              port: 9000
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 30