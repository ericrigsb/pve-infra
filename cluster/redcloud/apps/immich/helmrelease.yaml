apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 1h
  values:
    immich:
      persistence:
        library:
          enabled: true
          existingClaim: immich-library-pvc
    
    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                tag: v2.7.5
              env:
                DB_HOSTNAME: postgresql.postgresql.svc.cluster.local
                DB_USERNAME: postgres
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-secret
                      key: postgres-password
                      optional: false
                DB_DATABASE_NAME: immich
                REDIS_HOSTNAME: redis-master.redis.svc.cluster.local
                REDIS_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-secret
                      key: redis-password
                      optional: false
      resources:
        requests:
          cpu: 750m
          memory: 1.5Gi
        limits:
          cpu: 1.95
          memory: 3.3Gi
      persistence:
        externals:
          enabled: true
          existingClaim: ext-lib-pvc
          readOnly: true
    
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                tag: v2.5.6-cuda
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
      resources:
        requests:
          cpu: 600m
          memory: 1.6Gi
        limits:
          cpu: 1.6
          memory: 3.6Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache-pvc
          globalMounts:
            - path: /cache